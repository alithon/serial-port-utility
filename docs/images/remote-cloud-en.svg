<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><defs><marker id="arw-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="arw-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#667085"/></marker><marker id="arw-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#026aa2"/></marker></defs><rect x="0" y="0" width="760" height="270" fill="#ffffff"/><rect x="398" y="40" width="356" height="112" rx="10" fill="none" stroke="#b9c7d5" stroke-width="1.2" stroke-dasharray="5 4"/><text x="576" y="32" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">On-site network: behind NAT, no public address</text><rect x="8" y="60" width="140" height="76" rx="8" fill="#ffffff" stroke="#d9e2ec"/><text x="78.0" y="92" font-size="15" fill="#182230" font-weight="600" text-anchor="middle">Browser</text><text x="78.0" y="114" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle">Anywhere</text><rect x="209" y="60" width="140" height="76" rx="8" fill="#ffffff" stroke="#d9e2ec"/><text x="279.0" y="92" font-size="15" fill="#182230" font-weight="600" text-anchor="middle">Alithon cloud</text><text x="279.0" y="114" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle">Relay and auth</text><rect x="410" y="60" width="140" height="76" rx="8" fill="#ffffff" stroke="#d9e2ec"/><text x="480.0" y="92" font-size="15" fill="#182230" font-weight="600" text-anchor="middle">On-site PC</text><text x="480.0" y="114" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle">Cloud Console enabled</text><rect x="611" y="60" width="140" height="76" rx="8" fill="#f8fafc" stroke="#d9e2ec"/><text x="681.0" y="92" font-size="15" fill="#182230" font-weight="600" text-anchor="middle">Serial device</text><text x="681.0" y="114" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle">PLC / meter / module</text><line x1="154" y1="98.0" x2="203" y2="98.0" stroke="#026aa2" stroke-width="1.6" marker-end="url(#arw-info)"/><text x="178.5" y="86.0" font-size="11.5" fill="#026aa2" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">Outbound</text><line x1="404" y1="98.0" x2="355" y2="98.0" stroke="#026aa2" stroke-width="1.6" marker-end="url(#arw-info)"/><text x="379.5" y="86.0" font-size="11.5" fill="#026aa2" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">Heartbeat</text><line x1="556" y1="98.0" x2="605" y2="98.0" stroke="#667085" stroke-width="1.6" marker-end="url(#arw-grey)"/><text x="580.5" y="86.0" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round"></text><line x1="50" y1="178" x2="710" y2="178" stroke="#1d4ed8" stroke-width="1.6" marker-start="url(#arw-blue)" marker-end="url(#arw-blue)"/><text x="380" y="166" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">Data + serial parameter control (each capability granted on the desktop)</text><text x="380" y="208" font-size="12.5" fill="#667085" font-weight="400" text-anchor="middle">Both ends dial out, so the site needs no inbound port and no public IP</text><text x="380" y="232" font-size="12.5" fill="#667085" font-weight="400" text-anchor="middle">Works across regions, but both directions count against the cloud quota</text><text x="752" y="258" font-size="10.5" fill="#667085" font-weight="600" text-anchor="end" opacity="0.5" letter-spacing="0.06em">alithon.com</text></svg>
