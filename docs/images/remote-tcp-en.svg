<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><defs><marker id="arw-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="arw-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#667085"/></marker><marker id="arw-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#026aa2"/></marker></defs><rect x="0" y="0" width="760" height="270" fill="#ffffff"/><rect x="8" y="60" width="180" height="76" rx="8" fill="#ffffff" stroke="#d9e2ec"/><text x="98.0" y="92" font-size="15" fill="#182230" font-weight="600" text-anchor="middle">Remote PC</text><text x="98.0" y="114" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle">Any TCP program</text><rect x="295" y="60" width="180" height="76" rx="8" fill="#ffffff" stroke="#d9e2ec"/><text x="385.0" y="92" font-size="15" fill="#182230" font-weight="600" text-anchor="middle">On-site PC</text><text x="385.0" y="114" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle">Transparent bridge</text><rect x="582" y="60" width="170" height="76" rx="8" fill="#f8fafc" stroke="#d9e2ec"/><text x="667.0" y="92" font-size="15" fill="#182230" font-weight="600" text-anchor="middle">Serial device</text><text x="667.0" y="114" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle">PLC / meter / module</text><line x1="194" y1="98.0" x2="289" y2="98.0" stroke="#667085" stroke-width="1.6" marker-end="url(#arw-grey)"/><text x="241.5" y="86.0" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">Raw TCP bytes</text><line x1="481" y1="98.0" x2="576" y2="98.0" stroke="#667085" stroke-width="1.6" marker-end="url(#arw-grey)"/><text x="528.5" y="86.0" font-size="11.5" fill="#667085" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">Serial cable</text><line x1="50" y1="178" x2="710" y2="178" stroke="#667085" stroke-width="1.6" marker-start="url(#arw-grey)" marker-end="url(#arw-grey)"/><text x="380" y="166" font-size="13" fill="#667085" font-weight="600" text-anchor="middle">Bytes only, both directions</text><text x="380" y="208" font-size="12.5" fill="#b45309" font-weight="400" text-anchor="middle">The on-site side fixes the parameters — the remote end cannot change baud rate or DTR/RTS</text><text x="380" y="232" font-size="12.5" fill="#667085" font-weight="400" text-anchor="middle">The client must reach the on-site IP and port here too</text><text x="752" y="258" font-size="10.5" fill="#667085" font-weight="600" text-anchor="end" opacity="0.5" letter-spacing="0.06em">alithon.com</text></svg>
